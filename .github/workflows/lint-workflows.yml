name: Lint workflows

on:
  push:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

jobs:
  lint:
    uses: nkg/github-actions/.github/workflows/lint-workflows.yml@v3
    # Runner pool: repo variable RUNS_ON (JSON array) picks it, e.g.
    # '["self-hosted", "linux", "x64"]'; unset = GitHub-hosted. The shared
    # reusable defaults to self-hosted, and with no runner registered here
    # its jobs used to queue for 24h and get cancelled.
    with:
      runs-on: ${{ vars.RUNS_ON || '["ubuntu-latest"]' }}
